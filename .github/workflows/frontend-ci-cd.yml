name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

env:
  AWS_REGION: us-east-1 # Replace with your desired AWS region
  S3_BUCKET_NAME: thesis-rosca-frontend-bucket # Replace with your S3 bucket name
  CLOUDFRONT_DISTRIBUTION_ID: E1234567890ABC # Replace with your CloudFront Distribution ID

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List files for debugging
        run: |
          echo "Listing files in github.workspace:"
          ls -R ${{ github.workspace }}
          echo "Listing files in github.workspace/infrastructure:"
          ls -R ${{ github.workspace }}/infrastructure || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.x

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: infrastructure

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          cd frontend/thesis_rosca_app
          flutter pub get

      - name: Build Flutter web app
        run: |
          cd frontend/thesis_rosca_app
          flutter build web --release --dart-define=BACKEND_URL=http://${{ steps.terraform_outputs.outputs.ALB_DNS_NAME }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform Outputs
        id: terraform_outputs
        run: |
          echo "S3_BUCKET_NAME=$(terraform output -raw frontend_s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "ALB_DNS_NAME=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
        working-directory: infrastructure

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/thesis_rosca_app/build/web/ s3://${{ steps.terraform_outputs.outputs.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.terraform_outputs.outputs.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

